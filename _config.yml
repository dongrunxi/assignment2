# ============ 1. 站点基本信息 ============
title: 董润曦的博客
description: 网络与新媒体 · 学习记录与读书笔记
author: 董润曦

# ============ 2. 网址（最容易写错）============
# 仓库名叫 assignment2，网址就是 用户名.github.io/assignment2
url: "https://dongrunxi.github.io"
baseurl: "/assignment2"

# ============ 3. 外观：讲义站同款的文档式主题 ============
remote_theme: just-the-docs/just-the-docs

# ============ 4. 页面功能 ============
search_enabled: true
heading_anchors: 2
color_scheme: light

aux_links:
  "我的 GitHub":
    - "https://github.com/dongrunxi"

footer_content: "© 2026 董润曦 · 用 Markdown 写的博客"

# ============ 5. 这些文件只给自己看，不发布到网站上 ============
exclude:
  - README.md
  - "*.zip"

# 让网址不带 .html 后缀（/first-post/ 而不是 /first-post.html）
permalink: pretty
